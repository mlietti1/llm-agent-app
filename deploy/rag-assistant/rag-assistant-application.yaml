apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rag-assistant
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/mlietti1/llm-agent-app.git
    targetRevision: main
    path: deploy/rag-assistant
  destination:
    server: https://kubernetes.default.svc
    namespace: rag
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
